# Set default terminal
set -g default-terminal "${TERM}"

# Forward terminal focus-in/out events to panes so TUIs (Claude Code, nvim)
# know when their pane is active. Completes the focus chain:
# Hyprland → kitty → tmux → pane.
set -g focus-events on

# Kill the default 500ms ESC delay so nvim / Claude Code feel instant.
set -sg escape-time 0

# Declare 24-bit truecolor + undercurl passthrough so syntax highlighting
# and diff colours render correctly inside tmux instead of falling back
# to the degraded 256-colour palette.
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Large scrollback — Claude Code tool outputs get long.
set -g history-limit 50000

# Unbind default prefix (ctrl + b)
unbind C-b

# Use ctrl + s as new prefix
set -g prefix C-s

# Enable mouse support
set -g mouse on

# Use prefix + r to refresh tmux config
unbind r
bind r source-file ~/.tmux.conf

# vim key bindings for navigating panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# Thicker pane borders + arrow markers on the active pane — makes it
# obvious which split is focused when several Claude Code panes are open.
set -g pane-border-lines double
set -g pane-border-indicators both

# Don't bail out of the session when its last window closes. Keeps the
# session alive so the next window opens in the same working context.
set -g detach-on-destroy off

# Let certain escape sequences tunnel straight to the outer terminal
# instead of being swallowed by tmux. Required by image.nvim and similar
# tools that draw inline images — safe to enable now for later.
set -gq allow-passthrough on

# Enter copy-mode with `prefix + v` instead of the default `prefix + [`.
# Mirrors vim's visual-mode key so the muscle memory carries over when
# learning nvim.
unbind v
bind v copy-mode

# Use vi-style keys inside copy-mode (h/j/k/l/w/b/G/gg + v for visual).
setw -g mode-keys vi

# Let tmux hand copies to the terminal's system clipboard via OSC 52.
# Kitty supports OSC 52 and relays to the Wayland clipboard, so yanks
# land in wl-copy without an explicit pipe.
set -g set-clipboard on

# vi-style selection + yank bindings, with an explicit wl-copy pipe as
# a belt-and-braces fallback in case OSC 52 is ever stripped upstream.
bind-key -T copy-mode-vi v     send-keys -X begin-selection
bind-key -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'wl-copy'

# Mouse drag in copy-mode also pipes to wl-copy on release.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Catppuccin pinned to v0.3.0 — v1.x ships breaking changes that visually
# break the status bar. See linkarzu's note in dotfiles-latest.
set -g @plugin 'catppuccin/tmux#v0.3.0'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# --- Catppuccin theme (mocha + linkarzu blue palette) ---
# Palette and layout inspired by linkarzu/dotfiles-latest's
# `linkarzu-new-headings.sh` variant (blue active-window tint).
set -g @catppuccin_flavor 'mocha'

# Status bar layout — minimal, since waybar already shows the clock /
# system info. Only the session module on the left, nothing on the right.
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "null"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_default "on"
# Stand-alone module (only `session` on status-left). Default "yes" is for
# chaining modules into one pill, but it also forces the right cap to render
# fg=color,bg=color — invisible glyph, flat right edge. "no" gives bg=default
# on both caps so the pill has properly rounded ends.
set -g @catppuccin_status_connect_separator "no"
# Transparent status background — matches the existing status-bg default.
set -g @catppuccin_status_background "default"

# Active window: blue fg on pitch-black bg. The bg also becomes the *fg* of
# the window number (catppuccin inverts it), so pure #000000 gives a clean
# black digit with no blue cast.
set -g @catppuccin_window_current_color        "#5fa9f4"
set -g @catppuccin_window_current_background   "#000000"

# Inactive windows: muted blue fg, same pitch-black bg + digit colour.
set -g @catppuccin_window_default_color        "#264361"
set -g @catppuccin_window_default_background   "#000000"

# Pane borders: cyan for active, gray for inactive (color03 / color09).
set -g @catppuccin_pane_active_border_style    "fg=#04d1f9"
set -g @catppuccin_pane_border_style           "fg=#b7bfce"

# Session indicator: green idle, purple while prefix is held (color02 / color04).
set -g @catppuccin_session_color "#{?client_prefix,#987afb,#37f499}"

# Window text colours:
#   Active   → waybar white   #dcdfe1  (matches the rest of the bar).
#   Inactive → neutral grey   #a0a0a0  — faded, no blue/purple cast.
# Active variant also shows zoom + sync-panes indicator flags.
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#{?@claude_attention,#[fg=#f38ba8]● ,}#[fg=#a0a0a0]#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#{?@claude_attention,#[fg=#f38ba8]● ,}#[fg=#dcdfe1]#W#{?window_zoomed_flag,#[fg=#987afb] (    ),}#{?pane_synchronized,#[fg=#987afb] SYNC,}"

# Copy-mode / choose-tree selection colours (color02 on color13).
set -wF mode-style "fg=#37f499,bg=#232e3b"

# Set window and pane numbering to start at 1
set -g base-index 1
set -g pane-base-index 1

# Close a window mid-list and the rest slide left to fill the gap.
# Keeps `prefix + <n>` muscle memory reliable.
set -g renumber-windows on

# Attempting to make status bar transparent
set -g status-bg default
set -g status-style bg=default

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Belt-and-braces: keep the status-right empty even if a plugin tries
# to populate it (waybar already shows the clock).
set -g status-right ''

# Claude Code attention routing: clear dot + dismiss swaync notif on focus.
set-hook -g pane-focus-in 'run-shell -b "~/.config/claude/hooks/attention-clear.sh"'
