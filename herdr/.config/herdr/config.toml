onboarding = false
# Merged 2026-10-25: Omarchy's tmux-mirroring keys + UI (from its stock herdr config),
# with the Ubuntu-era theme and session settings layered on top.
# Omarchy keys: tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# vesper, not catppuccin: the base theme's mantle/base slots (tab strip default,
# selected workspace row) are NOT overridable via [theme.custom], and catppuccin's
# are blue-violet tinted — they read purple against kitty's neutral grey. vesper's
# are true neutrals (#1a1a1a / #101010). Everything visible is repainted below.
name = "vesper"
auto_switch = false

# Grey is the anchor, eldritch is the accent.
# Structural neutrals come from the VS Code Dark grey ramp that kitty's background
# (#1e1e1e) belongs to; colour identity stays canonical eldritch. The side panel is
# never painted, so the wallpaper shows through it regardless of panel_bg.
#
# Tab row: no surfaces at all. The terminal is translucent, so the ground's
# luminance varies with the wallpaper (measured #26..#2b) and any fill placed on it
# either reads muddy (mid-grey) or floats with no parent surface (dark). Tabs are
# text — dim inactive, cyan pill active — and nothing competes with the wallpaper.
# Alternative tried and rejected 2026-09-14 (VS Code idiom, dark bar + lighter pills):
#   panel_bg = "#181818", surface0 = "#2d2d2d"   then `herdr server reload-config`
[theme.custom]
panel_bg = "reset"    # tab strip: transparent
surface0 = "reset"    # inactive tab pills: none (text only)
active_row_bg = "reset"  # selected Space/Agent row: none (text only) — same language as the tabs; needs herdr >= 0.8.2
surface1 = "#3a3d41"  # active surface                  — kitty active_tab_background
overlay0 = "#666666"  # dim text / separators           — kitty color8
overlay1 = "#858585"  # dimmer-but-readable text        — VS Code line-number fg
text     = "#ebfafa"  # eldritch fg — primary text
subtext0 = "#858585"  # muted tier (inactive Spaces/agents, subtitles) — grey, same as inactive tabs; was eldritch blue #7081d0
accent   = "#04d1f9"  # eldritch cyan — active tab / primary highlight
blue     = "#04d1f9"  # eldritch cyan
teal     = "#39ddfd"  # eldritch bright cyan
green    = "#37f499"  # eldritch green
mauve    = "#a48cf2"  # eldritch purple
yellow   = "#f1fc79"  # eldritch yellow
peach    = "#f7c67f"  # eldritch orange
red      = "#f16c75"  # eldritch red

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[ui]
# accent comes from [theme.custom] (eldritch cyan); Omarchy's `accent = "blue"` dropped so it doesn't override it
show_agent_labels_on_pane_borders = false

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
tab_bar_right = [{ type = "zoom" }, { type = "hostname" }]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
status_indicators = "symbols"

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[session]
# Resume supported AI-agent panes into their exact native conversation sessions
# after a Herdr server restart (uses the per-pane session ref stored in session.json).
# Avoids the ambiguous `claude --resume` picker when multiple tabs share a cwd.
resume_agents_on_restore = true
